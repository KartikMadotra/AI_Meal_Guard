<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI MealGuard - Simple Tester</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background-color: #2980b9; }
        .image-container {
            position: relative;
            display: inline-block;
            margin-top: 10px;
            max-width: 100%;
        }
        img {
            max-width: 100%;
            border-radius: 4px;
            display: block;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        pre {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
        }
        .status {
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
        }
        .status.Excellent { background-color: #2ecc71; color: white; }
        .status.Good { background-color: #f1c40f; color: black; }
        .status.Adequate { background-color: #e67e22; color: white; }
        .status.Inadequate { background-color: #e74c3c; color: white; }
    </style>
</head>
<body>

    <h1>🥗 AI MealGuard (V2) Tester</h1>

    <div class="card">
        <h3>1. Upload Meal Image</h3>
        <input type="file" id="imageInput" accept="image/*">
        <br><br>
        <div class="image-container" id="imageContainer" style="display:none;">
            <img id="preview" />
            <canvas id="overlay"></canvas>
        </div>
    </div>

    <div class="card">
        <h3>2. Analyze</h3>
        <label>Student Age:</label>
        <input type="number" id="ageInput" value="10" min="6" max="18">
        <button id="analyzeBtn">Analyze Meal</button>
        <p id="loading" style="display:none;">⏳ Analyzing with AI...</p>
    </div>

    <div class="card" id="results" style="display:none;">
        <h3>3. Results</h3>
        
        <h4>Nutrition Score</h4>
        <p>Score: <span id="scoreVal"></span>/100</p>
        <p>Status: <span id="statusVal" class="status"></span></p>
        <p><em id="explanationVal"></em></p>
        
        <h4>Detected Foods & Estimated Quantities</h4>
        <ul id="foodsList"></ul>

        <h4>Recommendations</h4>
        <ul id="recommendationsList"></ul>

        <h4>Raw JSON Data</h4>
        <pre id="rawJson"></pre>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        const imageContainer = document.getElementById('imageContainer');
        const overlay = document.getElementById('overlay');
        const ctx = overlay.getContext('2d');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');

        let base64Image = null;

        // Preview image and convert to Base64
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    base64Image = event.target.result;
                    preview.src = base64Image;
                    preview.onload = () => {
                        imageContainer.style.display = 'inline-block';
                        // Clear canvas on new image upload
                        ctx.clearRect(0, 0, overlay.width, overlay.height);
                    };
                };
                reader.readAsDataURL(file);
            }
        });

        // Send to backend
        analyzeBtn.addEventListener('click', async () => {
            if (!base64Image) {
                alert("Please select an image first!");
                return;
            }

            loading.style.display = 'block';
            results.style.display = 'none';
            analyzeBtn.disabled = true;

            const age = document.getElementById('ageInput').value;

            try {
                const response = await fetch('http://127.0.0.1:8000/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        age: parseInt(age),
                        image_data: base64Image
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.statusText}`);
                }

                const data = await response.json();
                
                // Display Results
                document.getElementById('scoreVal').innerText = data.score;
                const statusEl = document.getElementById('statusVal');
                statusEl.innerText = data.status;
                statusEl.className = `status ${data.status}`;
                
                document.getElementById('explanationVal').innerText = data.explanation;

                // Foods
                const foodsList = document.getElementById('foodsList');
                foodsList.innerHTML = '';
                for (const [food, qty] of Object.entries(data.quantities)) {
                    const li = document.createElement('li');
                    li.innerText = `${food}: ${qty}g`;
                    foodsList.appendChild(li);
                }

                // Recommendations
                const recList = document.getElementById('recommendationsList');
                recList.innerHTML = '';
                data.recommendations.forEach(rec => {
                    const li = document.createElement('li');
                    li.innerText = rec;
                    recList.appendChild(li);
                });

                // Raw JSON
                document.getElementById('rawJson').innerText = JSON.stringify(data, null, 2);

                // Draw Bounding Boxes
                overlay.width = preview.width;
                overlay.height = preview.height;
                const scaleX = preview.width / preview.naturalWidth;
                const scaleY = preview.height / preview.naturalHeight;
                
                ctx.clearRect(0, 0, overlay.width, overlay.height);
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#2ecc71'; // Green box
                ctx.fillStyle = '#2ecc71';
                ctx.font = '16px Arial';

                const detections = data.detection.detections || [];
                detections.forEach(d => {
                    const [x1, y1, x2, y2] = d.bbox;
                    const w = (x2 - x1) * scaleX;
                    const h = (y2 - y1) * scaleY;
                    const rx = x1 * scaleX;
                    const ry = y1 * scaleY;

                    ctx.strokeRect(rx, ry, w, h);
                    
                    // Draw label background
                    const label = `${d.food} (${Math.round(d.confidence * 100)}%)`;
                    const textWidth = ctx.measureText(label).width;
                    ctx.fillRect(rx, ry - 20, textWidth + 10, 20);
                    
                    // Draw label text
                    ctx.fillStyle = 'white';
                    ctx.fillText(label, rx + 5, ry - 5);
                    ctx.fillStyle = '#2ecc71'; // reset for next box
                });

                results.style.display = 'block';
            } catch (error) {
                alert("Error: " + error.message);
                console.error(error);
            } finally {
                loading.style.display = 'none';
                analyzeBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
